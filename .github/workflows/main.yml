name: Build SC3K Facade Generator for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pillow pyinstaller

      - name: Build Windows app
        shell: pwsh
        run: >-
          pyinstaller --noconfirm --clean --windowed --onedir
          --name "SC3K Facade Generator v10"
          --add-data "библиотека;библиотека"
          --add-data "palette.png;."
          facade_builder.py

      - name: Package app folder
        shell: pwsh
        run: Compress-Archive -Path "dist/SC3K Facade Generator v10" -DestinationPath "SC3K_Facade_Generator_v10_Windows.zip" -Force

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SC3K-Facade-Generator-v10-Windows
          path: SC3K_Facade_Generator_v10_Windows.zip
          if-no-files-found: error
          retention-days: 14
